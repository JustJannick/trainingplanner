<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>justTrain</title>
<meta name="application-name" content="justTrain">
<meta name="apple-mobile-web-app-title" content="justTrain">
<meta name="theme-color" content="#1747c9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Plan, log and track your gym workouts.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/jt-192.png">
<link rel="apple-touch-icon" href="icons/jt-apple-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE everyday: a gym training log, brisk and practical, made to be used between sets
   IDEA the programme card a coach clips to a board, colour-coded like competition bumper plates
   PICTURE the week board: today's big red date with its workout, then seven days of plate-coloured workout chips
   COLOUR competition blue band, white card stock, plate red for today and alerts; yellow/green plates mark folders
   TYPE Barlow Condensed 700/800 for names and numbers + Barlow for text
   LAYOUT laptop: blue header with folder-tab nav, today card, 7-column week; phone: stacked day list with hanging dates, bottom tab bar */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0b1120);
--ink:light-dark(#101521,#edf1fa);
--mute:light-dark(#566079,#9aa5bd);
--line:light-dark(#dde2ec,#263252);
--card:light-dark(#ffffff,#121a2e);
--zone:light-dark(#f1f4fa,#172039);
--band:light-dark(#1747c9,#142a66);
--pri:light-dark(#1747c9,#4f7bff);
--red:light-dark(#d32b21,#ff6157);
--disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
html.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:url(img/bg.webp) 68% 55%/cover no-repeat;opacity:.2}
:root[data-theme=dark] body::before{opacity:.3}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) body::before{opacity:.3}}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip;-webkit-text-size-adjust:100%}
button{font:inherit}
[hidden]{display:none!important}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.top{background:var(--band);color:#fff;padding:18px max(5vw,16px) 0}
.top-in{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px 20px}
.top h1{font:800 clamp(32px,5vw,44px)/1.05 var(--disp);letter-spacing:-.01em;margin:0}
.pill{margin-left:auto;font-size:14px;padding:4px 12px;border-radius:99px;background:rgba(255,255,255,.16);white-space:nowrap}
.tabs{display:flex;gap:4px;width:100%;margin-top:14px}
.tabs a{color:#fff;opacity:.85;text-decoration:none;font:700 19px/1 var(--disp);padding:12px 18px 13px;border-radius:12px 12px 0 0}
.tabs a:hover{opacity:1;background:rgba(255,255,255,.1)}
.tabs a[aria-current=page]{background:var(--bg);color:var(--ink);opacity:1}
main{padding:22px max(5vw,16px) 64px}
main>.in{max-width:1240px;margin:0 auto}
h2,h3,h4{margin:0}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:30px 0 14px}
.bar h2{font:800 clamp(30px,4vw,36px)/1.05 var(--disp);margin-right:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:600 15px/1 Barlow,sans-serif;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:color-mix(in srgb,var(--pri) 50%,var(--line))}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.danger{color:var(--red)}
.btn.sm{min-height:40px;padding:0 12px;font-size:14px}
.btn.icon{width:44px;padding:0;font-size:18px}
.btn.wide{width:100%;margin:6px 0 16px}
.btn:disabled{opacity:.45;cursor:default}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid color-mix(in srgb,var(--pri) 60%,transparent);outline-offset:2px}
input,select,textarea{font:16px/1.3 Barlow,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:44px;width:100%}
textarea{resize:vertical}
.fl{display:flex;flex-direction:column;gap:5px;font:600 14px Barlow,sans-serif;color:var(--mute);margin-bottom:12px}
.chk{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink);cursor:pointer}
.chk input{width:22px;height:22px;min-height:0;flex:none;accent-color:var(--pri)}
.hint{color:var(--mute);font-size:15px;margin:4px 0 12px}
.empty{color:var(--mute);margin:8px 0 16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1 1 180px}
.plate{display:inline-block;flex:none;width:11px;height:28px;border-radius:3px;background:var(--p);box-shadow:inset -3px 0 0 rgba(0,0,0,.2),inset 2px 0 0 rgba(255,255,255,.25)}
.plate.big{width:16px;height:46px;border-radius:4px}
.plate.sm{width:8px;height:20px;vertical-align:-4px;margin-right:8px}
.note{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 14px;border-radius:12px;background:var(--zone);margin:18px 0 4px;font-size:15px}
.note.live{background:color-mix(in srgb,var(--red) 12%,var(--bg));margin-top:0}
.note .btn{margin-left:auto}
.today{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px 32px;padding:22px 24px;border:1px solid var(--line);border-radius:18px;background:var(--card)}
.tdate{display:flex;align-items:center;gap:12px;align-self:start}
.tnum{font:800 clamp(72px,10vw,104px)/.8 var(--disp);color:var(--red);letter-spacing:-.03em}
.tday{font:800 26px/1.05 var(--disp)}
.tday small{display:block;font:500 15px/1.3 Barlow,sans-serif;color:var(--mute);margin-top:4px}
.titem{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.titem .tx{flex:1}
.titem b{display:block;font:700 24px/1.1 var(--disp)}
.titem small{color:var(--mute);font-size:15px}
.donebadge{display:inline-flex;align-items:center;gap:4px;color:var(--pri);font-weight:700;white-space:nowrap}
.restday{font:700 24px/1.2 var(--disp);color:var(--mute);margin:6px 0 10px}
.tacts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.wkbar h2{margin-right:0}
.wnav{display:flex;align-items:center;gap:6px;margin-right:auto}
.rng{font-weight:600;white-space:nowrap;padding:0 4px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--card)}
.day{display:flex;flex-direction:column;gap:8px;border-left:1px solid var(--line);padding:12px 10px 12px;min-height:230px}
.day:first-child{border-left:0}
.day.is-today{background:var(--zone)}
.dh{display:flex;align-items:baseline;gap:6px}
.dn{font:800 36px/1 var(--disp)}
.dw{font-weight:600;font-size:15px;color:var(--mute)}
.is-today .dn{color:var(--red)}
.past .dn{color:var(--mute)}
.di{display:flex;flex-direction:column;gap:6px;flex:1}
.chip{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:5px 8px 5px 5px;font:600 15px/1.2 Barlow,sans-serif;cursor:pointer;min-height:44px}
.chip .pl{flex:none;width:7px;align-self:stretch;border-radius:3px;background:var(--p)}
.chip .cn{flex:1}
.chip.done{background:var(--zone)}
.chip.gone{color:var(--mute);font-style:italic}
.ck{flex:none;color:var(--pri)}
.add{margin-top:auto;border:1px dashed var(--line);background:none;color:var(--mute);border-radius:9px;min-height:44px;font:600 15px Barlow,sans-serif;cursor:pointer}
.add:hover{color:var(--pri);border-color:var(--pri)}
.fold h3{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font:800 28px/1.1 var(--disp);margin:28px 0 12px}
.fold h3 small{font:500 15px Barlow,sans-serif;color:var(--mute);margin-right:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,310px),1fr));gap:14px}
.wcard{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:14px;background:var(--card);padding:16px}
.wh{display:flex;align-items:center;gap:10px}
.wh h4{font:700 25px/1.1 var(--disp);flex:1}
.tag{font-size:13px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--zone);color:var(--mute)}
.meta,.last{margin:0;color:var(--mute);font-size:15px}
.exl{list-style:none;margin:4px 0;padding:0;font-size:15px}
.exl li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid var(--line)}
.exl em{font-style:normal;font-weight:700;color:var(--mute);display:inline-block;min-width:26px}
.exl b{font-weight:600;text-align:right}
.exl .more{color:var(--mute)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:8px}
.acts .btn{min-height:40px;padding:0 12px;font-size:14px}
.hist{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px 36px;align-items:start}
.hist h3{font:800 26px/1.1 var(--disp);margin:6px 0 10px}
.stats{display:flex;flex-wrap:wrap;gap:10px 40px;padding:14px 0;border-block:1px solid var(--line);margin-bottom:22px}
.stats b{display:block;font:800 clamp(34px,5vw,44px)/1 var(--disp)}
.stats span{color:var(--mute);font-size:15px}
.mon{font:700 15px Barlow,sans-serif;color:var(--mute);margin:18px 0 4px}
.sess{border-bottom:1px solid var(--line)}
.sess summary{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 2px;cursor:pointer;list-style:none}
.sess summary::-webkit-details-marker{display:none}
.sd{font:800 32px/1 var(--disp);text-align:center}
.sd small{display:block;font:600 13px Barlow,sans-serif;color:var(--mute);margin-top:2px}
.st b{display:block;font:700 21px/1.15 var(--disp)}
.st small{color:var(--mute);font-size:15px}
.chev{color:var(--mute);font-size:22px;transition:transform .15s}
.sess[open] .chev{transform:rotate(90deg)}
.sbody{padding:2px 0 14px 64px}
.sx{display:grid;grid-template-columns:minmax(0,11em) minmax(0,1fr);gap:10px;padding:5px 0;border-top:1px solid var(--line);font-size:15px}
.sx span{color:var(--mute)}
.snote{font-style:italic;color:var(--mute)}
.prog{position:sticky;top:16px;border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--card)}
.pbest{margin:12px 0 6px}
.pbest b{font:700 22px var(--disp)}
.scroll{overflow-x:auto}
.ptab{width:100%;border-collapse:collapse;font-size:15px}
.ptab th{text-align:left;font-weight:600;color:var(--mute);font-size:14px;padding:6px 4px;border-bottom:1px solid var(--line)}
.ptab td{padding:7px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
.pv{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.meter{width:80px;height:8px;border-radius:4px;background:var(--zone);overflow:hidden}
.meter i{display:block;height:100%;background:var(--pri)}
.pr{font-size:13px;font-weight:700;color:#fff;background:var(--red);padding:1px 6px;border-radius:99px}
.setup{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;align-items:start}
.panel{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--card)}
.panel h3{font:800 24px/1.1 var(--disp);margin-bottom:4px}
.frow{display:grid;grid-template-columns:auto minmax(0,1fr) 7.5em auto;gap:8px;align-items:center;margin-bottom:8px}
.panel textarea{margin-top:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:6px 0 10px}
.seg button{border:0;background:var(--card);color:var(--ink);min-height:44px;padding:0 18px;font-weight:600;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--pri);color:#fff}
.ov{position:fixed;inset:0;z-index:50;background:rgba(6,10,22,.55);display:flex;align-items:center;justify-content:center;padding:24px}
#dlg .ov{z-index:60}
.sheet{background:var(--bg);color:var(--ink);width:min(820px,100%);height:100%;max-height:940px;border-radius:18px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.sheet.small{width:min(500px,100%);height:auto;max-height:100%}
.sh{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.sh h2{font:800 28px/1.05 var(--disp);margin-right:auto}
.lt{margin-right:auto}
.lt h2{margin:0}
.lt small{color:var(--mute);font-size:15px}
.sb{flex:1;overflow-y:auto;padding:16px;overscroll-behavior:contain}
.sf{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line);background:var(--card)}
.frm{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:0 12px}
.exb,.lex{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;background:var(--card)}
.exb.ss,.lex.ss{margin-bottom:0;border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom-style:dashed}
.exb.ss+.exb,.lex.ss+.lex{border-top:0;border-top-left-radius:0;border-top-right-radius:0}
.exh{display:flex;gap:8px;align-items:center}
.exn{flex:none;min-width:38px;height:38px;padding:0 6px;border-radius:9px;background:var(--band);color:#fff;display:grid;place-items:center;font:800 19px var(--disp)}
.exh h3{font:700 23px/1.1 var(--disp);flex:1}
.exo{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:10px;align-items:center}
.exo label:not(.chk){display:flex;align-items:center;gap:6px;font-size:15px;color:var(--mute)}
.exo select{width:auto}
.exo input[data-f=rest]{width:70px;text-align:center}
.sets{width:100%;border-collapse:collapse;margin:10px 0 8px}
.sets th{font-weight:600;color:var(--mute);font-size:14px;text-align:center;padding:2px 3px}
.sets td{padding:3px}
.sets td:first-child{width:34px;font:800 20px var(--disp);text-align:center}
.sets input{text-align:center;padding:8px 4px}
.sets .prev{color:var(--mute);font-size:14px;text-align:center;white-space:nowrap;width:22%}
.sets td:last-child{width:50px}
.tick{width:46px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--line);cursor:pointer;display:grid;place-items:center}
.tick .ck{color:inherit}
.tick[aria-pressed=true]{background:var(--pri);border-color:var(--pri);color:#fff}
.tick.pop{animation:pop .28s ease-out}
@keyframes pop{40%{transform:scale(1.18)}}
tr.done td{background:color-mix(in srgb,var(--pri) 9%,transparent)}
.exnote{margin:6px 0 0;font-size:15px}
.lastline{margin:4px 0 0;color:var(--mute);font-size:14px}
.restinfo{margin-left:auto;color:var(--mute);font-size:14px}
.restbar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--band);color:#fff}
.restbar b{font:800 34px/1 var(--disp);margin-right:auto;font-variant-numeric:tabular-nums}
.restbar .btn{background:rgba(255,255,255,.14);border-color:transparent;color:#fff}
.steps{padding-left:22px;margin:4px 0 12px}
.steps li{margin-bottom:6px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.thumbs img{width:72px;height:120px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.istatus{font-weight:600;min-height:1.5em}
.pick{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 12px;margin-bottom:6px;cursor:pointer;min-height:44px}
.pick b{display:block;font:700 20px/1.15 var(--disp)}
.pick small{color:var(--mute);font-size:14px}
.pick:hover{border-color:var(--pri)}
.pick-h{display:flex;align-items:center;font:700 15px Barlow,sans-serif;color:var(--mute);margin:12px 0 6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
img[data-m]{background:#fff}
.thumb{flex:none;width:58px;height:39px;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.lex .thumb{width:72px;height:48px}
.howto{flex:none;min-height:40px;padding:0 10px;font-size:14px}
.exctl{display:flex;gap:6px;margin-left:auto}
.cnt{color:var(--mute);font-size:15px;margin-right:auto}
.lbar{align-items:baseline}
.lbar h2{margin-right:4px}
.lfil{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr);gap:8px;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;min-height:40px;padding:0 14px;font-weight:600;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lmeta{color:var(--mute);font-size:15px;margin:0 0 10px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:12px}
.lcard{display:flex;flex-direction:column;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;overflow:hidden;padding:0;cursor:pointer}
.lcard:hover{border-color:var(--pri)}
.lcard img{width:100%;height:auto;aspect-ratio:3/2;object-fit:cover;background:#fff;display:block}
.lcard b{font:700 18px/1.15 var(--disp);padding:8px 10px 2px}
.lcard small{color:var(--mute);font-size:13px;padding:0 10px 10px}
.more-row{display:flex;justify-content:center;margin:16px 0}
#lib .ov{z-index:55}
.sheet.lib{width:min(660px,100%);height:auto;max-height:100%}
.anim{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#fff;margin-bottom:12px}
.anim img{display:block;width:100%;height:auto;aspect-ratio:3/2;object-fit:contain}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.5em,1fr));gap:10px 16px;margin:16px 0}
.facts dt{font-size:13px;color:var(--mute);font-weight:600}
.facts dd{margin:0;font-weight:600}
.lib h3{font:800 22px/1.1 var(--disp);margin:6px 0 8px}
.src{font-size:13px;color:var(--mute);margin-top:14px}
.prow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px;margin-bottom:6px;cursor:pointer;min-height:56px}
.prow:hover{border-color:var(--pri)}
.prow img{width:66px;height:44px;object-fit:cover;border-radius:6px;flex:none;background:#fff}
.prow b{display:block;font:700 18px/1.15 var(--disp)}
.prow small{color:var(--mute);font-size:13px}
.signin{max-width:480px;margin:28px auto;padding:24px;border:1px solid var(--line);border-radius:18px;background:var(--card)}
.signin h2{font:800 32px/1.05 var(--disp);margin-bottom:6px}
.signin details{margin-top:14px}
.signin summary{cursor:pointer;font-weight:600;color:var(--pri);min-height:44px;display:flex;align-items:center}
body.out .tabs{display:none}
body.out .top{padding-bottom:18px}
.updbar{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:90;display:flex;gap:12px;align-items:center;background:var(--ink);color:var(--bg);padding:8px 8px 8px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 24px);font-weight:600}
.updbar .btn{background:var(--bg);color:var(--ink);border-color:var(--bg)}
@media(max-width:900px){
.week{grid-template-columns:minmax(0,1fr)}
.day{display:grid;grid-template-columns:62px minmax(0,1fr);gap:12px;border-left:0;border-top:1px solid var(--line);min-height:0;padding:12px 12px}
.day:first-child{border-top:0}
.dh{flex-direction:column;gap:2px;align-items:flex-start}
.dn{font-size:42px}
.add{margin-top:0}

<body>
<header class="top"><div class="top-in"><h1>justTrain</h1><span class="pill" id="pill" role="status">Loading…</span>
<nav class="tabs" aria-label="Sections"><a href="#week">Week</a><a href="#workouts">Workouts</a><a href="#exercises">Exercises</a><a href="#history">History</a><a href="#setup">Setup</a></nav></div></header>
<main><div class="in" id="view"><p class="empty">Loading your workouts…</p></div></main>
<div id="sheet"></div>
<div id="lib"></div>
<div id="dlg"></div>
<div class="toast" id="toast" role="status" hidden></div>
<datalist id="exnames"></datalist>
<div class="updbar" id="updbar" role="status" hidden><span>A new version of the app is ready.</span><button class="btn sm" data-act="doupdate">Update now</button></div>
<script src="config.js"></script>
<script src="fb.js"></script>
<script>
{
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const clone=o=>JSON.parse(JSON.stringify(o));
const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isFinite(n)?n:0};
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const addD=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x};
const monday=d=>addD(d,-((d.getDay()+6)%7));
const fmtD=(d,o)=>d.toLocaleDateString('en-US',o);
const fmtT=s=>{s=Math.max(0,Math.round(s||0));return Math.floor(s/60)+':'+pad(s%60)};
const parseT=v=>{v=String(v||'').trim().toLowerCase();if(!v)return 0;if(v.includes(':')){const p=v.split(':');return num(p[0])*60+num(p[1])}const n=num(v);return /(m|min|mins)$/.test(v)?n*60:n};
const fmtDur=ms=>{const s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+':'+pad(m)+':'+pad(s%60):m+':'+pad(s%60)};
const mins=ms=>Math.max(1,Math.round(ms/60000))+' min';
const pl=(n,w)=>n+' '+w+(n===1?'':'s');
const key=n=>String(n||'').trim().toLowerCase();
const CHECK='<svg class="ck" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M4 10.5l4 4 8-9" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const PLATES=[{k:'red',n:'Red',c:'#d32b21'},{k:'blue',n:'Blue',c:'#1747c9'},{k:'yellow',n:'Yellow',c:'#f2c318'},{k:'green',n:'Green',c:'#23894a'},{k:'grey',n:'Grey',c:'#8a93a6'}];
const TYPES={wr:'Weight × reps',r:'Reps only',t:'Time',d:'Distance + time'};
const COMMON=['Barbell bench press','Dumbbell bench press','Incline dumbbell press','Push-up','Barbell back squat','Goblet squat','Leg press','Romanian deadlift','Deadlift','Hip thrust','Walking lunge','Bulgarian split squat','Leg extension','Seated leg curl','Calf raise','Lat pulldown','Pull-up','Seated cable row','Single-arm dumbbell row','Face pull','Overhead press','Dumbbell shoulder press','Lateral raise','Biceps curl','Hammer curl','Triceps rope pushdown','Skull crusher','Plank','Side plank','Dead bug','Cable crunch','Kettlebell swing','Farmer carry','Treadmill','Rowing machine','Assault bike','Elliptical','Stair climber'];
const DEF={folders:[{id:'g1',name:'Gym 1',color:'red'},{id:'g2',name:'Gym 2',color:'blue'},{id:'mine',name:'My workouts',color:'yellow'}],unit:'lb'};
const S={cfg:null,workouts:{},plan:{},sessions:{},active:null};
const U={lq:'',lc:'All',lmu:'',leq:'',lshow:60,lview:null,lid:null,lctx:null,lpq:'',view:'week',ws:monday(new Date()),sheet:null,draft:null,dirty:false,isNew:false,hx:'',openSid:null,itab:'text',uid:null,email:'',upd:null,emailOpen:false,ifolder:null,itext:'',ibusy:false,ictl:null,canShots:null,canSample:null,maxImg:5,rest:null,sync:'',ready:false,pending:false};
let db=null,mode='loading',IDX=null;

const C=()=>S.cfg&&Array.isArray(S.cfg.folders)?S.cfg:DEF;
const unit=()=>C().unit||'lb';
const du=()=>unit()==='kg'?'km':'mi';
const folderOf=id=>C().folders.find(f=>f.id===id)||{id:'',name:'Unsorted',color:'grey'};
const plateC=k=>(PLATES.find(p=>p.k===k)||PLATES[4]).c;
const planItems=k=>(S.plan[k]&&S.plan[k].items)||[];
const sessList=()=>Object.values(S.sessions).filter(s=>s&&s.date).sort((a,b)=>(b.start||0)-(a.start||0));
function idx(){if(IDX)return IDX;IDX={byName:new Map(),lastW:new Map()};for(const s of sessList()){if(s.wid&&!IDX.lastW.has(s.wid))IDX.lastW.set(s.wid,s.date);for(const e of s.ex||[]){const k=key(e.name);if(!IDX.byName.has(k))IDX.byName.set(k,[]);IDX.byName.get(k).push({date:s.date,type:e.type||'wr',sets:e.sets||[]})}}return IDX}
const lastFor=n=>{const a=idx().byName.get(key(n));return a?a[0]:null};

function setTxt(s,t){const u=unit();s=s||{};if(t==='r')return (s.r||0)+' reps';if(t==='t')return fmtT(s.t);if(t==='d')return (s.d||0)+' '+du()+(s.t?' in '+fmtT(s.t):'');return (s.w?s.w+' '+u+' × ':'')+(s.r||0)}
function setShort(s,t){if(t==='r')return String(s.r||0);if(t==='t')return fmtT(s.t);if(t==='d')return (s.d||0)+' / '+fmtT(s.t);return (s.w||0)+'×'+(s.r||0)}
function exSum(e){const ss=e.sets||[];if(!ss.length)return 'No sets';const f=x=>[x.w||0,x.r||0,x.t||0,x.d||0].join();const same=ss.every(x=>f(x)===f(ss[0])),s=ss[0];
 if(same){if(e.type==='r')return ss.length+' × '+(s.r||0);if(e.type==='t')return ss.length+' × '+fmtT(s.t);if(e.type==='d')return (ss.length>1?ss.length+' × ':'')+setTxt(s,'d');return ss.length+' × '+(s.r||0)+(s.w?' @ '+s.w+' '+unit():'')}
 return ss.map(x=>setShort(x,e.type)).join(', ')}
const nSets=w=>(w.ex||[]).reduce((t,e)=>t+(e.sets||[]).length,0);
const estMin=w=>Math.max(5,Math.round((w.ex||[]).reduce((t,e)=>t+(e.sets||[]).length*(40+(e.ss?0:(+e.rest||60))),0)/60));
const wMeta=w=>pl((w.ex||[]).length,'exercise')+' · '+pl(nSets(w),'set')+' · ~'+estMin(w)+' min';
const sVol=s=>(s.ex||[]).reduce((t,e)=>t+(e.type==='wr'||!e.type?(e.sets||[]).reduce((a,x)=>a+(x.w||0)*(x.r||0),0):0),0);
const sSets=s=>(s.ex||[]).reduce((t,e)=>t+(e.sets||[]).length,0);
const sessMeta=s=>{const v=sVol(s);return (s.end?mins(s.end-s.start)+' · ':'')+pl(sSets(s),'set')+(v?' · '+v.toLocaleString('en-US')+' '+unit():'')};
function labels(ex){const out=[];let g=0,k=0;for(let i=0;i<ex.length;i++){if(!(i>0&&ex[i-1].ss)){g++;k=0}k++;out.push([g,k])}const size={};out.forEach(o=>size[o[0]]=(size[o[0]]||0)+1);return out.map(o=>String.fromCharCode(65+(o[0]-1)%26)+(size[o[0]]>1?o[1]:''))}
const COLS={wr:[{f:'w',l:()=>unit(),ph:'0'},{f:'r',l:()=>'Reps',ph:'10'}],r:[{f:'r',l:()=>'Reps',ph:'10'}],t:[{f:'t',l:()=>'Time',ph:'0:45'}],d:[{f:'d',l:()=>du(),ph:'1'},{f:'t',l:()=>'Time',ph:'10:00'}]};
const cellVal=(s,f)=>f==='t'?(s.t?fmtT(s.t):''):(s[f]?s[f]:'');

/* ---------- exercise library (Free Exercise DB, public domain) ---------- */
const LIB={list:null,byId:new Map(),err:false,cache:new Map()};
const STOP=new Set(['the','a','an','with','on','to','and','of','for','in','each','per','x']);
const SYN={db:'dumbbell',bb:'barbell',kb:'kettlebell',kettlebells:'kettlebell',dumbbells:'dumbbell',single:'one',assault:'air',rdl:'romanian deadlift',ohp:'overhead press',abs:'ab',situp:'situp'};
const VARI=new Set(['one','arm','alternate','alternating','reverse','decline','incline','close','kneeling','lying','side','plyo','jump','band','smith','partner','isometric','deficit','single','leg','offset','behind','neck','floor','ball','stability','weighted','assisted','plate','smr']);
function toks(s){
 s=String(s||'').toLowerCase().replace(/\(.*?\)/g,' ').replace(/(push|pull|sit|chin|step)[\s-]?ups?\b/g,'$1up').replace(/[^a-z0-9]+/g,' ').trim();
 const out=[];for(let w of s.split(' ')){if(!w||STOP.has(w))continue;w=SYN[w]||w;for(let t of w.split(' ')){if(t.length>3&&t.endsWith('s')&&!t.endsWith('ss'))t=t.slice(0,-1);out.push(t)}}return out;
}
function matchName(n){
 if(!LIB.list)return null;const k=key(n);if(!k)return null;if(LIB.cache.has(k))return LIB.cache.get(k);
 const ut=toks(n),us=new Set(ut);let best=null,bs=1e9;
 if(ut.length)for(const x of LIB.list){if(ut.every(t=>x.ts.has(t))){const extra=x.tk.filter(t=>!us.has(t));const s=extra.length+extra.filter(t=>VARI.has(t)).length*2+x.n.length/1000;if(s<bs){bs=s;best=x}}}
 LIB.cache.set(k,best);return best;
}
function libFor(e){if(!LIB.list||!e)return null;if(e.lib&&LIB.byId.has(e.lib))return {x:LIB.byId.get(e.lib),auto:false};const x=matchName(e.name);return x?{x,auto:true}:null}
const CH=5,chunkP=new Map();
function loadChunk(n){if(!chunkP.has(n))chunkP.set(n,fetch('lib/c/'+n+'.json').then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).catch(()=>{chunkP.delete(n);return {}}));return chunkP.get(n)}
async function fillImg(img){const m=img.dataset.m;if(!m||img.getAttribute('src'))return;const c=await loadChunk(Math.floor(parseInt(m,10)/CH));if(c[m]&&img.isConnected&&!img.getAttribute('src'))img.src='data:image/webp;base64,'+c[m]}
let imgIO=null,hyRaf=0;const warmed=new Set();
function warmMedia(){if(!LIB.list)return;for(const w of Object.values(S.workouts))for(const e of w.ex||[]){const m=libFor(e);if(m&&m.x.m){const n=Math.floor(parseInt(m.x.m,10)/CH);if(!warmed.has(n)){warmed.add(n);loadChunk(n)}}}}
function hydrate(){const imgs=document.querySelectorAll('img[data-m]:not([src])');if(!imgs.length)return;if('IntersectionObserver' in window){imgIO=imgIO||new IntersectionObserver(es=>{for(const e of es)if(e.isIntersecting){imgIO.unobserve(e.target);fillImg(e.target)}},{rootMargin:'400px'});imgs.forEach(i=>imgIO.observe(i))}else imgs.forEach(fillImg)}
const imgMO=new MutationObserver(()=>{if(!hyRaf)hyRaf=requestAnimationFrame(()=>{hyRaf=0;hydrate()})});
imgMO.observe(document.body,{childList:true,subtree:true});
const yt=n=>'https://www.youtube.com/results?search_query='+encodeURIComponent(n+' exercise proper form');
const EQN={'':'None','body only':'Bodyweight','e-z curl bar':'EZ bar','kettlebells':'Kettlebell','bands':'Band','foam roll':'Foam roller','exercise ball':'Exercise ball','medicine ball':'Medicine ball','cable':'Cable','machine':'Machine','barbell':'Barbell','dumbbell':'Dumbbell','other':'Other'};
const capW=s=>String(s||'').replace(/\b\w/g,c=>c.toUpperCase());
const CATS=['All','Strength','Stretching','Cardio','Plyometrics','Powerlifting','Olympic lifting','Strongman'];
async function loadLib(){
 try{const r=await fetch('lib/ex.json');if(!r.ok)throw new Error(r.status);const j=await r.json();
  LIB.list=(j.ex||[]).filter(x=>x&&x.n);LIB.list.forEach(x=>{x.tk=toks(x.n);x.ts=new Set(x.tk);LIB.byId.set(x.id,x)});LIB.cache.clear();
 }catch(e){LIB.err=true}
 render();if(U.sheet==='edit'||U.sheet==='log')renderSheet();warmMedia();
}
function libFilter(q,c,mu,eq){
 const qt=toks(q);
 const r=LIB.list.filter(x=>(!c||c==='All'||x.c===c)&&(!mu||x.pm.includes(mu)||x.sm.includes(mu))&&(!eq||x.eq===eq)&&(!qt.length||qt.every(t=>x.tk.some(w=>w.startsWith(t)))));
 if(qt.length)r.sort((a,b)=>(a.tk[0]&&a.tk[0].startsWith(qt[0])?0:1)-(b.tk[0]&&b.tk[0].startsWith(qt[0])?0:1)||a.tk.length-b.tk.length);
 return r;
}
const muscLine=x=>capW(x.pm.join(', '))+(x.c==='Stretching'?' stretch':'');
function libResults(){
 if(LIB.err)return '<p class="empty">The exercise library couldn’t load. Check your connection and reopen this page.</p>';
 if(!LIB.list)return '<p class="empty">Loading the exercise library…</p>';
 const r=libFilter(U.lq,U.lc,U.lmu,U.leq),n=Math.min(r.length,U.lshow);
 return `<p class="lmeta" role="status">${r.length?pl(r.length,'exercise'):'No exercises match. Try fewer words or clear a filter.'}</p><div class="lgrid">${r.slice(0,n).map(x=>`<button class="lcard" data-act="libopen" data-id="${esc(x.id)}">${x.m?`<img data-m="${x.m}" alt="" width="420" height="280">`:''}<b>${esc(x.n)}</b><small>${esc(muscLine(x))} · ${esc(EQN[x.eq]||capW(x.eq))}</small></button>`).join('')}</div>${r.length>n?`<div class="more-row"><button class="btn" data-act="lmore">Show more (${r.length-n} left)</button></div>`:''}`;
}
function vExercises(){
 const mus=LIB.list?[...new Set(LIB.list.flatMap(x=>x.pm))].sort():[],eqs=LIB.list?[...new Set(LIB.list.map(x=>x.eq))].sort((a,b)=>(EQN[a]||a).localeCompare(EQN[b]||b)):[];
 return `<div class="bar lbar"><h2>Exercises</h2><span class="cnt">${LIB.list?LIB.list.length+' exercises with photos and step-by-step instructions':''}</span></div>
<div class="lfil"><input id="lq" type="search" value="${esc(U.lq)}" placeholder="Search, e.g. hamstring stretch" aria-label="Search exercises" autocomplete="off"><select id="lmu" aria-label="Muscle"><option value="">All muscles</option>${mus.map(m=>`<option value="${esc(m)}"${m===U.lmu?' selected':''}>${esc(capW(m))}</option>`).join('')}</select><select id="leq" aria-label="Equipment"><option value="">All equipment</option>${eqs.map(e=>`<option value="${esc(e)}"${e===U.leq?' selected':''}>${esc(EQN[e]||capW(e))}</option>`).join('')}</select></div>
<div class="chips" role="group" aria-label="Type">${CATS.map(c=>`<button data-act="lcat" data-c="${c}" aria-pressed="${U.lc===c}">${c}</button>`).join('')}</div>
<div id="lres">${libResults()}</div><p class="src">Photos and instructions from Free Exercise DB (public domain). Tap any exercise for the full how-to and a link to video demos.</p>`;
}
function libDetail(x){
 const c=U.lctx||{where:'lib'};
 const act=c.where==='edit'?(c.auto||!c.linked?'<button class="btn" data-act="libuse">Use for this exercise</button>':''):c.where==='log'?(c.auto?'<button class="btn" data-act="libuse">This is the right one</button>':''):'<button class="btn" data-act="libadd">Add to a workout</button>';
 return `<div class="ov" data-act="libbg"><div class="sheet lib" role="dialog" aria-modal="true" aria-labelledby="lbh"><div class="sh"><h2 id="lbh">${esc(x.n)}</h2><button class="btn" data-act="libclose">Close</button></div><div class="sb">
${c.auto?`<div class="note" style="margin-top:0"><span>Closest match for “${esc(c.name)}”.</span><button class="btn sm" data-act="libpick">Choose another</button></div>`:''}
${x.m?`<div class="anim"><img data-m="${x.m}" alt="${esc(x.n)}, start and end position" width="420" height="280"></div>`:''}
<div class="row"><a class="btn pri" href="${yt(x.n)}" target="_blank" rel="noopener">Watch video demos</a>${act}${c.where!=='lib'&&!c.auto?'<button class="btn" data-act="libpick">Change</button>':''}</div>
<dl class="facts"><div><dt>Type</dt><dd>${esc(x.c)}</dd></div><div><dt>Level</dt><dd>${esc(capW(x.lv)||'–')}</dd></div><div><dt>Equipment</dt><dd>${esc(EQN[x.eq]||capW(x.eq))}</dd></div><div><dt>Main muscles</dt><dd>${esc(capW(x.pm.join(', '))||'–')}</dd></div>${x.sm.length?`<div><dt>Also works</dt><dd>${esc(capW(x.sm.join(', ')))}</dd></div>`:''}</dl>
<h3>How to do it</h3><ol class="steps">${x.in.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><p class="src">Photos and instructions from Free Exercise DB (public domain). Videos open on YouTube.</p></div></div></div>`;
}
function libPicker(){
 const c=U.lctx||{},r=LIB.list?libFilter(U.lpq,'All','','').slice(0,40):[];
 return `<div class="ov" data-act="libbg"><div class="sheet lib" role="dialog" aria-modal="true" aria-labelledby="lph"><div class="sh"><h2 id="lph">${c.where==='editadd'?'Add from library':'Find the how-to'}</h2><button class="btn" data-act="libclose">Close</button></div><div class="sb">
${c.name?`<p class="hint">Pick the library exercise that matches “${esc(c.name)}”, or <a href="${yt(c.name)}" target="_blank" rel="noopener">watch videos of “${esc(c.name)}” on YouTube</a>.</p>`:''}
<input id="lpq" type="search" value="${esc(U.lpq)}" placeholder="Search exercises" aria-label="Search exercises" autocomplete="off" style="margin-bottom:10px"><div id="lpres">${lpRows(r)}</div></div></div></div>`;
}
const lpRows=r=>!LIB.list?'<p class="empty">Loading the exercise library…</p>':r.length?r.map(x=>`<button class="prow" data-act="libchoose" data-id="${esc(x.id)}">${x.m?`<img data-m="${x.m}" alt="">`:''}<span><b>${esc(x.n)}</b><small>${esc(muscLine(x))} · ${esc(EQN[x.eq]||capW(x.eq))}</small></span></button>`).join(''):'<p class="empty">No matches. Try another word.</p>';
function renderLib(){const el=$('#lib');if(!U.lview){el.innerHTML='';return}const x=U.lview==='detail'&&LIB.byId.get(U.lid);el.innerHTML=U.lview==='pick'?libPicker():x?libDetail(x):'';if(U.lview==='pick'){const q=$('#lpq');if(q)q.focus()}}
function openHowto(where,i){
 const src=where==='edit'?U.draft&&U.draft.ex[i]:S.active&&S.active.ex[i];if(!src)return;
 const m=libFor(src);U.lctx={where,i,name:src.name,auto:m?m.auto:false,linked:!!src.lib};
 if(m){U.lview='detail';U.lid=m.x.id}else{U.lview='pick';U.lpq=src.name||''}
 renderLib();
}
function exFromLib(x){const e=newEx();e.name=x.n;e.lib=x.id;
 if(x.c==='Stretching'){e.type='t';e.rest=15;e.sets=[0,1].map(()=>({w:0,r:0,t:30,d:0}))}
 else if(x.c==='Cardio'){e.type='t';e.rest=0;e.sets=[{w:0,r:0,t:600,d:0}]}
 else if(x.eq==='body only'||!x.eq){e.type='r'}
 return e}
function linkLib(x){
 const c=U.lctx||{};
 if(c.where==='editadd'){U.draft.ex.push(exFromLib(x));U.dirty=true;U.lview=null;renderLib();renderSheet();const l=document.querySelectorAll('#sheet .exb');if(l.length)l[l.length-1].scrollIntoView({block:'center'});toast('Added '+x.n);return}
 if(c.where==='edit'&&U.draft&&U.draft.ex[c.i]){const e=U.draft.ex[c.i];e.lib=x.id;if(!String(e.name).trim())e.name=x.n;U.dirty=true;renderSheet()}
 else if(c.where==='log'&&S.active&&S.active.ex[c.i]){const e=S.active.ex[c.i];e.lib=x.id;setActive(S.active);relog(c.i);
  const tpl=S.active.wid&&S.workouts[S.active.wid];if(tpl){const n=clone(tpl);let ch=false;(n.ex||[]).forEach(t=>{if(key(t.name)===key(e.name)&&t.lib!==x.id){t.lib=x.id;ch=true}});if(ch){n.updated=Date.now();put('workouts',n.id,n)}}}

If several screenshots show one long workout, merge them in order and never repeat an exercise that appears in two screenshots. Only make separate workouts if they clearly show different named workouts.

function normW(o,folder){
 const ex=(Array.isArray(o.exercises)?o.exercises:[]).map(e=>{const type=['wr','r','t','d'].includes(e.type)?e.type:'wr';let sets=(Array.isArray(e.sets)?e.sets:[]).slice(0,20).map(s=>({r:num(s.reps??s.r),w:num(s.weight??s.w),t:num(s.time??s.t),d:num(s.distance??s.d)}));if(!sets.length)sets=[{r:10,w:0,t:0,d:0}];return {id:uid(),name:String(e.name||'Exercise').trim().slice(0,80),type,rest:Math.round(num(e.rest))||60,note:String(e.note||'').slice(0,200),ss:!!(e.superset||e.ss),sets}});
 if(ex.length)ex[ex.length-1].ss=false;
 return {id:uid(),name:String(o.name||'Imported workout').trim().slice(0,80),folder,note:String(o.note||'').slice(0,300),ex,created:Date.now(),updated:Date.now()};
}
function parseText(txt){
 const out=[];let cur=null,blank=true;
 for(const raw of String(txt).split(/\r?\n/)){
  const L=raw.replace(/^[\s•*\-–]+/,'').replace(/^\d+[.)]\s+/,'').trim();
  if(!L){blank=true;continue}
  const sx=L.match(/(\d+)\s*(?:sets?\s*)?[x×*]\s*(\d+(?::\d{1,2})?(?:\.\d+)?)\s*(sec|secs|s|min|mins|reps?)?/i);
  const dist=L.match(/(\d+(?:\.\d+)?)\s*(mi|miles?|km)\b(?:\s*(?:in|\/)\s*(\d+(?::\d{2})?)\s*(min)?)?/i);
  if(!sx&&!dist&&(blank||!cur)){cur={name:L.replace(/[:\-–]+$/,'').trim(),exercises:[]};out.push(cur);blank=false;continue}
  blank=false;if(!cur){cur={name:'Imported workout',exercises:[]};out.push(cur)}
  const e={name:L,type:'wr',rest:0,superset:false,note:'',sets:[]};
  const wt=L.match(/(?:@|at)\s*(\d+(?:\.\d+)?)|(\d+(?:\.\d+)?)\s*(?:lb|lbs|kg)\b/i),w=wt?num(wt[1]||wt[2]):0;
  const rs=L.match(/rest\s*(\d+(?::\d{2})?)\s*(s|sec|secs|min|mins)?/i);if(rs)e.rest=/min/i.test(rs[2]||'')?num(rs[1])*60:parseT(rs[1]);
  let cut=L.length;
  if(sx){cut=sx.index;const n=Math.min(20,Math.max(1,+sx[1])),v=sx[2],u=(sx[3]||'').toLowerCase();
   if(v.includes(':')||/^(s|sec|secs|min|mins)$/.test(u)){e.type='t';const t=v.includes(':')?parseT(v):(u.startsWith('min')?num(v)*60:num(v));e.sets=Array.from({length:n},()=>({time:t}))}
   else{e.type=w?'wr':'r';e.sets=Array.from({length:n},()=>({reps:num(v),weight:w}))}}
  else if(dist){cut=dist.index;e.type='d';e.sets=[{distance:num(dist[1]),time:dist[3]?(dist[3].includes(':')?parseT(dist[3]):num(dist[3])*60):0}]}
  else e.sets=[0,1,2].map(()=>({reps:10,weight:w}));
  e.name=L.slice(0,cut).replace(/[\s:,\-–—]+$/,'').trim()||'Exercise';
  cur.exercises.push(e);
 }
 return {workouts:out.filter(w=>w.exercises.length)};
}

async function restore(){

 if(r.k!=='ok')return;
 const jobs=[];if(o.cfg&&Array.isArray(o.cfg.folders))jobs.push(['cfg','main',o.cfg]);

function fbDb(fsx,uid){
 const F=window.FB,base='users/'+uid+'/';
 const wrap=x=>({id:x.id,exists:x.exists(),data:()=>x.data(),metadata:x.metadata});
 const mkq=(p,cons)=>({orderBy:(f,d)=>mkq(p,cons.concat(F.orderBy(f,d||'asc'))),limit:n=>mkq(p,cons.concat(F.limit(n))),
  onSnapshot:(next,err)=>F.onSnapshot(F.query(F.collection(fsx,base+p),...cons),{includeMetadataChanges:true},x=>next({docs:x.docs.map(wrap),metadata:x.metadata}),err)});
 return {doc:p=>{const r=F.doc(fsx,base+p);return {get:async()=>wrap(await F.getDoc(r)),set:d=>F.setDoc(r,d),delete:()=>F.deleteDoc(r),onSnapshot:(next,err)=>F.onSnapshot(r,{includeMetadataChanges:true},x=>next(wrap(x)),err)}},collection:p=>mkq(p,[])};
}

<div class="row"><button class="btn pri" data-act="esign">Sign in</button><button class="btn" data-act="ecreate">Create account</button><button class="btn" data-act="ereset">Forgot password</button></div></details>
<p id="aerr" class="istatus" role="status"></p></section>`}

 aerr('');if(!auth)return;

async function emailAuth(kind){

 navigator.serviceWorker.register('sw.js').then(reg=>{
  const ready=w=>{U.upd=w;const b=$('#updbar');if(b)b.hidden=false};
  if(reg.waiting&&navigator.serviceWorker.controller)ready(reg.waiting);
  reg.addEventListener('updatefound',()=>{const w=reg.installing;if(w)w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)ready(w)})});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update().catch(()=>{})});
  setInterval(()=>reg.update().catch(()=>{}),3600000);
 }).catch(()=>{});
 let reloading=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloading)return;reloading=true;location.reload()});
}

 });
}
start();
